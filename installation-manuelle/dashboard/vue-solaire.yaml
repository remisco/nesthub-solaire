      - overflow: visible
      grid:
      - grid-template-areas: '"a"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      custom_fields:
        a:
        - width: 100%
        - line-height: '0'
    extra_styles: |2

      @keyframes tourne{to{transform:rotate(360deg)}}
      @keyframes derive{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2.5px)}}
      @keyframes pluie{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(9px);opacity:0}}
      @keyframes neige{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(2px,10px);opacity:0}}
      @keyframes eclair{0%,70%,100%{opacity:0}74%{opacity:1}78%{opacity:.2}82%{opacity:1}}
      @keyframes brume{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
      @keyframes vent{0%{stroke-dasharray:0 60;opacity:0}30%{opacity:1}100%{stroke-dasharray:60 0;opacity:0}}
      @keyframes etoile{0%,100%{opacity:.15}50%{opacity:1}}
      .tourne{animation:tourne 16s linear infinite}
      .derive{animation:derive 6s ease-in-out infinite}
      .derive2{animation:derive 8s ease-in-out infinite reverse}
      .pluie{animation:pluie linear infinite}
      .neige{animation:neige 2.6s linear infinite}
      .eclair{animation:eclair 3s linear infinite}
      .brume{animation:brume 4s ease-in-out infinite}
      .vent{animation:vent 2.4s ease-out infinite}
      .etoile{animation:etoile 2.5s ease-in-out infinite}
    custom_fields:
      a: |
        [[[ const n=(id)=>{const s=states[id];if(!s)return 0;let v=parseFloat(s.state);if(isNaN(v))return 0;return (s.attributes.unit_of_measurement||'')==='kW'?v*1000:v;};
        const w=states['weather.forecast_home'], w2=states['weather.forecast_home'];
        const m=(w&&!['unavailable','unknown'].includes(w.state))?w:w2;
        let e=m?m.state:'cloudy';
        const nuit=(states['sun.sun']||{}).state==='below_horizon';
        if(nuit&&e==='sunny') e='clear-night';
        const t=m&&m.attributes.temperature!=null?Math.round(m.attributes.temperature)+'°':'';
        const nuage=(x,y,s,f)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M8 22h26a7 7 0 0 0 0-14a10 10 0 0 0-19-2a8 8 0 0 0-7 16z" fill="url(#${f})" stroke="#94a3b8" stroke-width=".7"/></g>`;
        const soleil=(x,y,r)=>{let l='';for(let k=0;k<8;k++){const a=k*Math.PI/4;l+=`<line x1="${(x+(r+2)*Math.cos(a)).toFixed(1)}" y1="${(y+(r+2)*Math.sin(a)).toFixed(1)}" x2="${(x+(r+5)*Math.cos(a)).toFixed(1)}" y2="${(y+(r+5)*Math.sin(a)).toFixed(1)}"/>`;}
         return `<g class="tourne" style="transform-origin:${x}px ${y}px" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round">${l}</g><circle cx="${x}" cy="${y}" r="${r}" fill="url(#gs)"/>`;};
        const lune=(x,y)=>`<path d="M${x+3} ${y-8}a8.5 8.5 0 1 0 6 13a7 7 0 0 1-6-13z" fill="#FDE68A" stroke="#F59E0B" stroke-width=".6"/>`+
         [[x-12,y-6,0],[x+12,y-10,.8],[x+16,y+4,1.6],[x-8,y+8,2.2]].map(([a,b,d])=>`<circle class="etoile" cx="${a}" cy="${b}" r=".9" fill="#FBBF24" style="animation-delay:${d}s"/>`).join('');
        const pluie=(nb,v)=>{let s='';for(let k=0;k<nb;k++){s+=`<line class="pluie" x1="${41+k*(26/nb)}" y1="30" x2="${39.5+k*(26/nb)}" y2="34" stroke="#3B82F6" stroke-width="1.3" stroke-linecap="round" style="animation-duration:${v}s;animation-delay:${(k*v/nb).toFixed(2)}s"/>`;}return s;};
        const neige=(nb)=>{let s='';for(let k=0;k<nb;k++){s+=`<circle class="neige" cx="${42+k*(24/nb)}" cy="30" r="1.2" fill="#fff" stroke="#93C5FD" stroke-width=".5" style="animation-delay:${(k*.5).toFixed(1)}s"/>`;}return s;};
        const eclair=`<path class="eclair" d="M55 27l-4 7h3l-2 6 6-8h-3l2-5z" fill="#FACC15" stroke="#CA8A04" stroke-width=".5"/>`;
        const brume=[0,1,2].map(k=>`<line class="brume" x1="38" y1="${30+k*4}" x2="70" y2="${30+k*4}" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" opacity=".7" style="animation-delay:${k*.6}s"/>`).join('');
        const vent=[0,1,2].map(k=>`<path class="vent" d="M30 ${14+k*7}h22a4 4 0 1 0-4-4" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" style="animation-delay:${k*.4}s"/>`).join('');
        const N1=nuage(34,3,1,'gn'), N2=(f)=>nuage(36,4,1,f);
        let ic='';
        switch(e){
         case 'sunny': ic=soleil(55,20,8);break;
         case 'clear-night': ic=lune(55,20);break;
         case 'partlycloudy': ic=(nuit?lune(48,13):soleil(48,13,6))+`<g class="derive">${N1}</g>`;break;
         case 'cloudy': ic=`<g class="derive2">${nuage(28,0,.75,'gn')}</g><g class="derive">${N1}</g>`;break;
         case 'rainy': ic=pluie(5,.9)+`<g class="derive">${N2('gp')}</g>`;break;
         case 'pouring': ic=pluie(9,.55)+`<g class="derive">${N2('gp')}</g>`;break;
         case 'snowy': ic=neige(5)+`<g class="derive">${N1}</g>`;break;
         case 'snowy-rainy': ic=pluie(3,.9)+neige(3)+`<g class="derive">${N1}</g>`;break;
         case 'hail': ic=neige(6)+`<g class="derive">${N2('gp')}</g>`;break;
         case 'lightning': ic=eclair+`<g class="derive">${N2('go')}</g>`;break;
         case 'lightning-rainy': ic=pluie(5,.7)+eclair+`<g class="derive">${N2('go')}</g>`;break;
         case 'fog': ic=`<g class="derive">${N1}</g>`+brume;break;
         case 'windy': case 'windy-variant': ic=vent+(e==='windy-variant'?`<g class="derive">${nuage(38,0,.7,'gn')}</g>`:'');break;
         default: ic=`<g class="derive">${N1}</g>`;
        }
        return `<svg viewBox="0 0 80 44" width="100%" overflow="visible"><defs>
        <linearGradient id="gn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
        <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/></linearGradient>
        <linearGradient id="go" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient>
        <radialGradient id="gs"><stop offset="0" stop-color="#FDE047"/><stop offset="1" stop-color="#F59E0B"/></radialGradient></defs>
        ${ic}<text x="27" y="27" text-anchor="end" font-family="Roboto,Arial,sans-serif" font-size="11" font-weight="700" fill="#334155">${t}</text></svg>`;
         ]]]
    style:
      left: 23.97%
      top: 84.70%
      width: 12.70%
      pointer-events: none
