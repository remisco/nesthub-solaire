        const s=(states['sensor.rte_tempo_couleur_actuelle']||{}).state||'';
        const f=s==='Rouge'?'hue-rotate(136deg) saturate(4.5) brightness(.92)':s==='Blanc'?'grayscale(1) brightness(1.08)':'saturate(1.6)';
        const g=s==='Rouge'?'#DC2626':s==='Blanc'?'#9CA3AF':s==='Bleu'?'#2563EB':'transparent';
        return `<div class="cal" style="backdrop-filter:${f};-webkit-backdrop-filter:${f};--g:${g}"></div>`;
