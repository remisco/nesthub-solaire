        const p=n('sensor.solar_power');
        if(p<20) return '<svg viewBox="0 0 1 1" width="100%"></svg>';
        const d=Math.max(.8,2.6-p/1500).toFixed(2);
        let pts='';for(let k=0;k<3;k++){pts+=`<circle class="pt" cx="0" cy="5" r="1.8" fill="#22C55E" style="animation-duration:${d}s;animation-delay:${(k*d/3).toFixed(2)}s"/>`;}
        return `<svg viewBox="0 0 40 10" width="100%"><line x1="2" y1="5" x2="38" y2="5" stroke="#22C55E" stroke-width=".8" stroke-dasharray="1.5 2.5" opacity=".45"/>${pts}</svg>`;
         ]]]
    style:
      left: 49.52%
      top: 12.40%
      width: 6.35%
      pointer-events: none
