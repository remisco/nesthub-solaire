      @keyframes respire{0%,100%{opacity:0}50%{opacity:.9}}
      .cal{position:relative;width:100%;aspect-ratio:1;border-radius:16%}
      .cal::after{content:"";position:absolute;inset:-3px;border-radius:18%;box-shadow:0 0 12px 3px var(--g);animation:respire 3.5s ease-in-out infinite;will-change:opacity}
