        if(n('sensor.solar_power')<20) return '<svg viewBox="0 0 1 1" width="100%"></svg>';
        return `<svg viewBox="0 0 20 12" width="100%"><circle cx="10" cy="6" r="5" fill="#22C55E" opacity=".25"/><circle class="led" cx="10" cy="6" r="2.4" fill="#4ADE80"/></svg>`;
         ]]]
    style:
