      @keyframes vague{from{transform:translateX(0)}to{transform:translateX(20px)}}
      @keyframes bulle{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-44px);opacity:0}}
      .vague{animation:vague 2.4s linear infinite;will-change:transform}
      .bulle{animation:bulle 3s ease-in infinite}
    custom_fields:
      a: |
        [[[ const n=(id)=>{const s=states[id];if(!s)return 0;let v=parseFloat(s.state);if(isNaN(v))return 0;return (s.attributes.unit_of_measurement||'')==='kW'?v*1000:v;};
        const l=Math.min(300,Math.max(0,n('sensor.eau_chaude_disponible'))), t=n('sensor.water_heater_temperature');
        const col=t>=50?'#EF4444':t>=40?'#F97316':t>=30?'#F59E0B':'#3B82F6';
        const h=Math.round(62*l/300), y=69-h;
        const nb=t>=55?5:t>=45?3:t>=35?1:0;
        let b='';for(let k=0;k<nb;k++){b+=`<circle class="bulle" cx="${9+k*5}" cy="66" r="1.5" fill="#fff" opacity=".9" style="animation-delay:${(k*.6).toFixed(1)}s"/>`;}
        return `<svg viewBox="0 0 40 72" width="100%"><defs><clipPath id="cb"><rect x="3" y="4" width="30" height="66" rx="9"/></clipPath></defs>
        <g clip-path="url(#cb)"><g class="vague"><path d="M-40 ${y} q5 -2.5 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 V80 H-40Z" fill="${col}" opacity=".1"/>
        <path d="M-40 ${y} q5 -2.5 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke="${col}" stroke-width="1.6" opacity=".75"/>
        <path d="M-40 ${y+1.2} q5 -2.5 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke="#fff" stroke-width=".8" opacity=".7"/></g>${b}</g></svg>`;
         ]]]
