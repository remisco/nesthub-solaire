      .arc{animation:arc linear infinite;transform-origin:46px 46px;will-change:transform}
      .coeur{animation:coeur 1.8s ease-in-out infinite;transform-origin:46px 46px}
    custom_fields:
      a: |
        [[[ const n=(id)=>{const s=states[id];if(!s)return 0;let v=parseFloat(s.state);if(isNaN(v))return 0;return (s.attributes.unit_of_measurement||'')==='kW'?v*1000:v;};
        const c=n('sensor.house_power'), i=n('sensor.grid_import_power');
        const col=i<50?'#4ADE80':'#FB923C', d=Math.max(1.4,9-c/350).toFixed(1);
        const arc=(r,da,op,w,dl)=>`<circle class="arc" cx="46" cy="46" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${da}" opacity="${op}" style="animation-duration:${d}s;animation-delay:-${dl}s"/>`;
        return `<svg viewBox="0 0 92 92" width="100%">${arc(36,'30 196',.25,7,0)}${arc(36,'30 196',1,2.6,0)}${arc(36,'12 214',.6,2,d/2)}
        <circle class="coeur" cx="46" cy="46" r="11" fill="${col}"/></svg>`;
         ]]]
    style:
