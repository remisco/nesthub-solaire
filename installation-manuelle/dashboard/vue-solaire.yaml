# Vue « Solaire » pour Google Nest Hub — picture-elements + calques animés button-card
# Remplacez les entités sensor.* par les vôtres (voir README, section « Adapter les capteurs »).
title: Solaire
path: solaire
type: panel
theme: Nest Hub clair
cards:
- type: picture-elements
  image: /local/nesthub_fond.png?v=1
  card_mod:
    style: |
      ha-card { border-radius: 0; box-shadow: none; border: none; overflow: hidden; }
  elements:
  - type: custom:button-card
    entity: sensor.solar_power
    triggers_update:
    - sensor.solar_power
    name: anime-panneaux
    show_name: false
    show_icon: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
      - background: none
      - box-shadow: none
      - border: none
      - padding: '0'
      - border-radius: '0'
      - overflow: visible
      grid:
      - grid-template-areas: '"a"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      custom_fields:
        a:
        - width: 100%
        - line-height: '0'
    extra_styles: |2

      @keyframes reflet{from{transform:translateX(-50px) skewX(-22deg)}to{transform:translateX(150px) skewX(-22deg)}}
      @keyframes et{0%,70%,100%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1)}}
      .reflet{animation:reflet linear infinite;will-change:transform}
      .et{animation:et 3.2s ease-in-out infinite;opacity:0}
    custom_fields:
      a: |
        [[[ const n=(id)=>{const s=states[id];if(!s)return 0;let v=parseFloat(s.state);if(isNaN(v))return 0;return (s.attributes.unit_of_measurement||'')==='kW'?v*1000:v;};
        const p=n('sensor.solar_power');
        const poly='0,0 86,0 86,36 58,89 0,89';
        if(p<20) return `<svg viewBox="0 0 87 89" width="100%"><polygon points="${poly}" fill="#0b1530" opacity=".4"/></svg>`;
        const d=Math.max(1.8,6.5-p/700).toFixed(1);
        const et=[[18,20,0],[52,14,1.3],[34,50,2.1],[66,32,.6],[14,66,1.8]].map(([x,y,t])=>`<path class="et" style="animation-delay:${t}s;transform-origin:${x}px ${y}px" d="M${x} ${y-4}L${x+1} ${y-1}L${x+4} ${y}L${x+1} ${y+1}L${x} ${y+4}L${x-1} ${y+1}L${x-4} ${y}L${x-1} ${y-1}Z" fill="#fff"/>`).join('');
        return `<svg viewBox="0 0 87 89" width="100%"><defs><clipPath id="cp"><polygon points="${poly}"/></clipPath>
        <linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        <g clip-path="url(#cp)"><rect class="reflet" x="0" y="-20" width="26" height="140" fill="url(#lg)" style="animation-duration:${d}s"/>${et}</g></svg>`;
         ]]]
    style:
      left: 6.90%
      top: 11.74%
      width: 13.81%
      pointer-events: none
